name: Sync and deploy FlightDeck

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync real TestFlight catalog
        run: node scripts/sync-testflight.mjs

      - name: Verify JavaScript
        run: |
          node --check app.js
          node --check scripts/sync-testflight.mjs
          node scripts/test-webmcp.mjs

      - name: Verify catalog JSON
        run: python3 -m json.tool apps.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
